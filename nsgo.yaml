name: MyGoolApk
id: com.lemonfish.mycoolapkgo
version: 0.1.2

icon:
  png: assets/Icon.png
  # macOS shows an icon as drawn: scripts/gen_mac_icon.py shapes this one from Icon.png.
  apple: assets/AppIcon.icns
  android:
    foreground: assets/IconForeground.png
    background: "#16b36c"

url_schemes: [coolmarket]

apple:
  info:
    NSPhotoLibraryAddUsageDescription: 保存图片到相册

android:
  permissions: [android.permission.WRITE_EXTERNAL_STORAGE]

# In-app updates on Android and macOS read the latest GitHub release's appcast,
# signed with the secret key releases build with (NSGO_UPDATES_KEY).
updates:
  key: jaDUPWWYhv7lOUBGqTxy94hVpV8IvdmzmpAud0QH0eM=
  automatic: true

build:
  output: dist
  targets: [android_arm64, ios, macos_universal]

licenses:
  allow: [github.com/XiaoMengXinX/CoolapkApi-Go]
